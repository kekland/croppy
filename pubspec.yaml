name: croppy
description: A fully customizable image cropper for Flutter. Mobile-first, but supports Web and Desktop platforms.
version: 1.6.1
homepage: https://github.com/kekland/croppy

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cassowary: ^0.4.3

  # ffi/native assets
  ffi: ^2.2.0
  code_assets: ^2.2.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.6
  android_libcpp_shared: ^0.3.1

  # ui
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  cupertino_icons: ^2.0.0
  equatable: ^2.0.5
  vector_math: ^2.4.4
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  ffigen: ^20.1.1

flutter:
  plugin:
    platforms:
      web:
